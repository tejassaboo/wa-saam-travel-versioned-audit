_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Audit a Washington State travel voucher under the rules in force on the day the travel began"
summary: "An agent audits one Washington State travel voucher under a toy handbook paraphrased from SAAM Chapter 10 and OFM directives 25A-01, 26A-01 and 26A-05. The rules changed over time: business class needed more than 14 hours of scheduled flying before 2025 and more than 8 hours after, and the POV mileage rate went $0.67, $0.70, $0.725, $0.76. The same flight can earn different verdicts on either side of January 1, 2025. It also applies the 150% lodging exception and the eleven-hour same-day meal rule. A deterministic verifier checks the cabin, mileage, lodging and meal answers. Ask it to run a scenario: seattle-tokyo-2024-12, seattle-tokyo-2025-01, seattle-tokyo-late-approval, seattle-tokyo-miles-unspent, olympia-honolulu-connection, boston-first-class, yakima-day-trip-jun30, yakima-day-trip-jul01, volunteer-day-trip-dec31, spokane-new-year-drive, spokane-escalated-no-approval, chicago-conference-venue, chicago-loyalty-points, chicago-forum-king, chicago-forum-tower or boston-auditors-meeting."
highlights:
  - "Version-sensitive: the departure date picks one of four dated rule regimes"
  - "Every boundary tested at the limit and one unit past it: 480/481 and 840/841 minutes, each rate change's eve and day, 150% of lodging plus meals to the cent"
  - "One correct audit per scenario, checked by a pure-Python oracle with no LLM judge"
steps:
  - "Name a scenario, for example seattle-tokyo-2025-01"
  - "The agent reads the voucher and looks up the rules in effect on the dates that matter"
  - "It submits the reimbursable cabin, mileage, lodging basis and amount, and same-day meal eligibility"
  - "The verifier explains the verdict with a reason code and the numbers"
