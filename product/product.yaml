_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Audit a Washington State travel voucher under the rules in force on the day the travel began"
summary: "An agent audits one Washington State travel voucher under a toy handbook paraphrased from SAAM Chapter 10 and OFM directives 25A-01, 26A-01 and 26A-05. The rules changed over time: business class needed more than 14 hours of scheduled flying before 2025 and more than 8 hours after, and the POV mileage rate went $0.67, $0.70, $0.725, $0.76. The same flight can earn different verdicts on either side of January 1, 2025. It also applies the 150% lodging exception, the eleven-hour same-day meal rule and totals what the state pays. A deterministic verifier checks the cabin, mileage, lodging, meal and total answers, with partial credit per field. Ask it to run a scenario: seattle-tokyo-seafood, seattle-tokyo-buyers, seattle-tokyo-apples, seattle-tokyo-health, seattle-tokyo-ceramics, seattle-tokyo-lacquer, seattle-tokyo-robotics, olympia-honolulu-reef, seattle-honolulu-fisheries, seattle-honolulu-aquaculture, boston-transport-session, boston-licensing-hearing, boston-state-auditors, yakima-riparian-plots, yakima-plot-followup, millersylvania-debris-cleanup, olympia-pesticide-hearing, spokane-arena-inspection, spokane-crane-audit, spokane-bridge-review, chicago-forum-lakeshore, chicago-forum-colleague, chicago-forum-king, chicago-forum-tower, chicago-forum-delegation or chicago-forum-outreach."
highlights:
  - "Version-sensitive: the departure date picks one of four dated rule regimes"
  - "Twin vouchers straddle every boundary by one unit: 480 vs 481 scheduled minutes, departures on 2024-12-31 vs 2025-01-01, $486.00 vs $486.01 against the 150% cap, 299, 300, 659 and 660 travel minutes"
  - "One correct audit per scenario, checked by a pure-Python oracle with no LLM judge"
steps:
  - "Name a scenario, for example seattle-tokyo-buyers"
  - "The agent reads the voucher and looks up the rules in effect on the dates that matter"
  - "It submits the reimbursable cabin, mileage, lodging basis and amount, same-day meal eligibility and the voucher total"
  - "The verifier explains the verdict with a reason code and the numbers, and scores each live field"
